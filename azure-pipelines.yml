
trigger:
  - main

pool:
  name: 'new test'

steps:
# 1. Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: '1.17.0'

# 2. Initialize Terraform
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(Build.SourcesDirectory)'
    backendServiceArm: 'AT&T'
    backendAzureRmResourceGroupName: 'mk-rg'
    backendAzureRmStorageAccountName: 'wwwwwwwertyuiolvdlskv'
    backendAzureRmContainerName: 'yoyo'
    backendAzureRmKey: 'assignment.tfstate'

# 3. Validate Terraform code
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(Build.SourcesDirectory)'

# 4. Check what Terraform will create
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(Build.SourcesDirectory)'
    environmentServiceNameAzureRM: 'AT&T'
